<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121b"><title>Alerts Fast</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><small>PRIVATE MONITOR</small><h1>🔔 Alerts <em>Fast</em></h1><p>Έτοιμα καμπανάκια χωρίς νέους υπολογισμούς</p></div><b id="status">Εκκίνηση</b></header><section id="loginPanel" class="card auth"><h2>Ιδιωτική είσοδος</h2><p>Κωδικός υπάρχουσας ιδιωτικής προβολής</p><form id="loginForm"><input class="input" id="code" type="password" autocomplete="current-password" placeholder="Κωδικός" required><button class="primary">Είσοδος</button></form><p id="loginError"></p></section><section id="dashboard" hidden><div class="toolbar card"><div><strong id="count">—</strong><small id="stamp">Χωρίς δεδομένα</small></div><button id="refresh">Ανανέωση</button><button id="logout">Έξοδος</button></div><p id="notice">Τα δεδομένα δεν είναι live.</p><div id="alerts"></div></section><footer>Μόνο προβολή • Κανένα καμπανάκι δεν αλλάζει</footer></main><script src="/app.js" defer></script></body></html>
