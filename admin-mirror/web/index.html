<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070708"><title>DTT Admin Mirror</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="panel"><div class="head"><div class="sub">DREAMTEAMTIPS • PRIVATE</div><div class="row"><div class="title">👑 DTT Admin Mirror</div><span class="sub" id="state">Έτοιμο</span></div></div><div class="body"><div id="login"><p class="note">Νέα ανεξάρτητη εφαρμογή με δικό της κωδικό.</p><input id="pin" type="password" class="input" placeholder="Κωδικός Mirror"><button class="btn" id="enter" style="width:100%;margin-top:10px">Είσοδος</button><p class="error" id="error"></p></div><section id="dashboard" hidden><div class="row"><div><b id="count">Καμπανάκια</b><div id="updated" class="subtle">Δεν υπάρχουν δεδομένα</div></div><button class="btn secondary" id="refresh">Ανανέωση</button></div><div class="nav"><button class="btn active" data-page="alerts">Καμπανάκια</button><button class="btn secondary" data-page="leagues">Πρωταθλήματα</button><button class="btn secondary" data-page="settings">Ρυθμίσεις</button></div><div class="note" id="notice"></div><div id="alerts"></div><div id="leagues" hidden></div><div id="settings" hidden></div><button class="btn secondary" id="logout" style="width:100%;margin-top:18px">Έξοδος</button></section></div></div></div><script src="/app.js" defer></script></body></html>
