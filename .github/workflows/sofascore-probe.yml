name: SofaScore Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "sofascore_probe.py"
      - ".github/workflows/sofascore-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run SofaScore probe
        run: python sofascore_probe.py
