name: Lineup Lens Greek Super League source probe
on:
  push:
    branches:
      - research/lineup-greek-superleague-20261124
    paths:
      - "lineup_lens/probe_greek_lineups.py"
      - ".github/workflows/lineup-greek-source-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit public archived Greek Super League lineups (read-only, no Neon)
        run: python lineup_lens/probe_greek_lineups.py
