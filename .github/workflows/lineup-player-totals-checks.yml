name: Lineup Lens individual statistics display checks
on:
  push:
    branches:
      - feature/lineup-stats-display-20261127
    paths:
      - 'lineup_lens/private_player_totals.py'
      - 'lineup_lens/test_private_player_totals.py'
      - 'lineup_lens/templates/index.html'
      - '.github/workflows/lineup-player-totals-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r lineup_lens/requirements.txt
      - run: python3 -m compileall -q lineup_lens
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_private_player_totals.py' -v
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("lineup_lens/templates/index.html").read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/lineup-ui.js').write_text(js[0])
          PY
          node --check /tmp/lineup-ui.js
