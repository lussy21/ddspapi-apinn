name: Lineup Lens Greek league complete season audit
on:
  push:
    branches:
      - research/lineup-greek-superleague-20261124
    paths:
      - "lineup_lens/research_greek_espn_coverage.py"
      - ".github/workflows/lineup-greek-full-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read only official Greek Super League starting XI audit
        run: python lineup_lens/research_greek_espn_coverage.py
