name: Lineup impact checks
on:
  push:
    branches:
      - feature/lineup-impact-dashboard-20261127
      - feature/lineup-goal-context-20261128
      - research/lineup-eight-leagues-stats-20261128
      - feature/lineup-shrinkage-20261128
      - lineup-lens-personal
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r lineup_lens/requirements.txt
      - run: python3 -m compileall -q lineup_lens
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_lineup_impact.py' -v
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_lineup_goal_context.py' -v
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_espn_player_metrics.py' -v
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_lineup_shrinkage.py' -v
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_simple_replacements.py' -v
      - run: PYTHONPATH=lineup_lens python3 -m unittest discover -s lineup_lens -p 'test_lineup_footprint.py' -v
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("lineup_lens/templates/index.html").read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          assert s.index('id="footprintPanel"')<s.index('id="pitchLines"')
          assert 'team.impact' in js[0]
          assert 'team.replacements' in js[0]
          Path('/tmp/lineup.js').write_text(js[0])
          PY
          node --check /tmp/lineup.js
