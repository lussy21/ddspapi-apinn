name: Lineup Lens canonical Opta reconciliation
on:
  push:
    branches:
      - research/lineup-bulk-player-stats-20261127
    paths:
      - 'lineup_lens/research_reconcile_opta.py'
      - '.github/workflows/lineup-opta-reconcile.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install duckdb
      - run: python3 lineup_lens/research_reconcile_opta.py
