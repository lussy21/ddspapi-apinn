<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="description" content="Match Alerts">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Match Alerts</title>
<style>
:root{--bg:#070708;--text:#f7f6f1;--muted:#9c99a1;--gold:#d9b157;--gold2:#f1d78e;--line:rgba(255,255,255,.075);--danger:#ff8d98}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(760px 430px at 50% -120px,rgba(217,177,87,.12),transparent 60%),linear-gradient(180deg,#0a0a0c 0%,#050506 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),transparent 86%)}
.app{width:min(100%,580px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px max(42px,env(safe-area-inset-bottom));position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--gold2);font-size:22px;border:1px solid rgba(217,177,87,.34);background:linear-gradient(145deg,rgba(217,177,87,.14),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.28)}
.brand h1{margin:0;font-family:Georgia,serif;font-size:24px;font-weight:600;line-height:1}.sub{margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:1.7px;text-transform:uppercase}
.live{display:flex;align-items:center;gap:7px;color:#b0aeb4;font-size:10px;letter-spacing:1.1px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(217,177,87,.75)}
.card{border:1px solid rgba(217,177,87,.18);border-radius:26px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 18px 48px rgba(0,0,0,.34)}
.auth{margin-top:26px}.auth h2,.summary h2{margin:0;font-family:Georgia,serif;font-size:29px;line-height:1.05;font-weight:500}.auth p,.summary p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 15px}.tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#aaa7af;padding:11px;border-radius:13px;font-weight:800}.tab.active{color:#fff4d2;border-color:rgba(217,177,87,.28);background:rgba(217,177,87,.10)}
.field{margin:10px 0}.label{display:block;margin:0 0 6px 2px;color:#bcb8c0;font-size:11px;font-weight:800}.input{width:100%;border:1px solid rgba(255,255,255,.10);background:#0a0a0c;color:#fff;border-radius:14px;padding:13px 14px;font:inherit;outline:none}.input:focus{border-color:rgba(217,177,87,.55)}
.primary,.ghost{width:100%;border-radius:14px;padding:13px 14px;font-weight:900;font-size:13px}.primary{border:1px solid rgba(217,177,87,.30);background:linear-gradient(145deg,rgba(217,177,87,.20),rgba(217,177,87,.08));color:#fff4d2}.primary:disabled{opacity:.65;cursor:wait}.ghost{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#ddd}
.actions{display:flex;gap:9px;margin-top:12px}.actions>*{flex:1}.msg{min-height:18px;margin-top:12px;color:#bdb9c1;font-size:12px;line-height:1.4}.msg.error{color:var(--danger)}.msg.ok{color:#dff0c7}.verify-code{letter-spacing:8px;text-align:center;font-weight:900;font-size:21px}.hidden{display:none!important}
.summary{margin-bottom:18px}.summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.counter{display:inline-flex;margin-top:14px;padding:8px 11px;border-radius:999px;background:rgba(217,177,87,.08);border:1px solid rgba(217,177,87,.18);color:#fff4d2;font-size:11px;font-weight:800;white-space:nowrap}.status-mini{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:4px}
.userline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.userchip{font-size:11px;color:#d8d3c6}.logout{border:0;background:none;color:#8f8b95;font-size:11px;text-decoration:underline}
.league{margin:18px 0 10px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.018));box-shadow:0 12px 32px rgba(0,0,0,.22)}
.league-head{padding:14px 14px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055)}.league-title{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold2)}.league-count{font-size:11px;color:var(--muted)}
.row{padding:14px;border-bottom:1px solid rgba(255,255,255,.045)}.row:last-child{border-bottom:0}.match{font-size:15px;font-weight:800;letter-spacing:-.15px;line-height:1.25;margin-bottom:8px}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.side{color:#85828a;font-size:11px}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid rgba(217,177,87,.18);background:rgba(217,177,87,.075);color:#fff7de;white-space:normal;text-align:right}.badge.watch{color:#ededf0;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}.badge.strong{color:#ffd9bd;background:rgba(194,71,20,.10);border-color:rgba(232,102,44,.22)}.alert-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.history{font-size:10px;color:#b9b5bc;text-align:right;white-space:nowrap}.history b{color:#f1d78e;font-weight:900}
.empty,.loading{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}footer{text-align:center;color:#68656d;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;padding-top:28px}
@media(max-width:470px){.summary-top{flex-direction:column}.status-mini{padding-top:0}.meta{align-items:flex-start;flex-direction:column}.badge{text-align:left}.alert-right{align-items:flex-start}.history{text-align:left;white-space:normal}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand"><div class="logo">♛</div><div><h1>Match Alerts</h1><div class="sub">Private Access</div></div></div><div class="live"><span class="dot"></span>Live</div></div>

<section id="authView" class="card auth">
  <div id="authMain">
    <h2 id="authTitle">Σύνδεση</h2>
    <p id="authText">Μπες στον λογαριασμό σου για να δεις τα ενεργά alerts.</p>
    <div class="tabs"><button class="tab active" id="loginTab">Σύνδεση</button><button class="tab" id="registerTab">Δωρεάν εγγραφή</button></div>
    <div id="emailField" class="field hidden"><label class="label">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <div class="field"><label class="label">Όνομα χρήστη</label><input class="input" id="username" autocomplete="username" placeholder="username"></div>
    <div class="field"><label class="label">Κωδικός</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="primary" id="authSubmit">Σύνδεση</button>
    <button class="ghost hidden" id="haveCodeBtn" style="margin-top:9px">Έχω ήδη κωδικό</button>
    <div class="msg" id="authMsg"></div>
  </div>

  <div id="verifyView" class="hidden">
    <h2>Επιβεβαίωση email</h2>
    <p id="verifyText">Σου στείλαμε 6ψήφιο κωδικό.</p>
    <div class="field"><label class="label">Κωδικός επιβεβαίωσης</label><input class="input verify-code" id="verifyCode" inputmode="numeric" maxlength="6" placeholder="000000"></div>
    <button class="primary" id="verifySubmit">Επιβεβαίωση</button>
    <div class="actions"><button class="ghost" id="resendCode">Ξαναστείλε κωδικό</button><button class="ghost" id="backLogin">Πίσω</button></div>
    <div class="msg" id="resendTimer"></div>
    <div class="msg" id="verifyMsg"></div>
  </div>
</section>

<section id="alertsView" class="hidden">
  <div class="userline"><div class="userchip" id="currentUser"></div><button class="logout" id="logoutBtn">Αποσύνδεση</button></div>
  <section class="card summary"><div class="summary-top"><div><h2>Today's Alerts</h2><p>Ενεργά alerts από το σύστημα.</p></div><div class="status-mini" id="updatedAt">—</div></div><div class="counter" id="counter">0 ενεργά alerts</div></section>
  <div id="content"><div class="loading">Φόρτωση…</div></div>
</section>
<footer>Match Alerts · Private</footer>
</main>
<script>
const API_URL="https://match-alerts-api-private.onrender.com/api";
let mode="login", pendingUsername="", sessionToken=localStorage.getItem("ma_token")||"";

async function apiPost(params){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const body=new URLSearchParams();
    Object.entries(params).forEach(([k,v])=>body.append(k,String(v??"")));
    const res=await fetch(API_URL,{
      method:"POST",
      body,
      signal:controller.signal,
      cache:"no-store"
    });
    const data=await res.json().catch(()=>({ok:false,error:"BACKEND_BAD_RESPONSE"}));
    if(!res.ok && !data.error) data.error="BACKEND_UNREACHABLE";
    return data;
  }catch(err){
    if(err.name==="AbortError") throw new Error("TIMEOUT");
    throw new Error("BACKEND_UNREACHABLE");
  }finally{
    clearTimeout(timer);
  }
}
function setMsg(el,text,type=""){el.textContent=text;el.className="msg"+(type?" "+type:"");}
function mapError(code){
  const m={
    BAD_USERNAME:"Το όνομα χρήστη πρέπει να έχει 3–32 χαρακτήρες: λατινικά, αριθμούς, τελεία, _ ή -.",
    BAD_EMAIL:"Το email δεν είναι σωστό.",
    PASSWORD_TOO_SHORT:"Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες.",
    USER_EXISTS:"Αυτό το όνομα χρήστη υπάρχει ήδη.",
    EMAIL_EXISTS:"Αυτό το email είναι ήδη εγγεγραμμένο.",
    INVALID_LOGIN:"Λάθος όνομα χρήστη ή κωδικός.",
    EMAIL_NOT_VERIFIED:"Το email δεν έχει επιβεβαιωθεί.",
    ACCESS_REVOKED:"Η πρόσβασή σου έχει απενεργοποιηθεί.",
    REGISTRATION_FULL:"Οι δωρεάν θέσεις έχουν συμπληρωθεί.",
    BAD_CODE:"Ο κωδικός πρέπει να είναι 6 ψηφία.",
    INVALID_CODE:"Ο κωδικός επιβεβαίωσης είναι λάθος.",
    CODE_EXPIRED:"Ο κωδικός έληξε. Πάτησε «Ξαναστείλε κωδικό».",
    USER_NOT_FOUND:"Ο λογαριασμός δεν βρέθηκε.",
    SESSION_EXPIRED:"Η σύνδεση έληξε. Μπες ξανά.",
    INVALID_SESSION:"Χρειάζεται νέα σύνδεση.",
    ACCESS_DENIED:"Δεν υπάρχει ενεργή πρόσβαση.",
    SHEET_READ_FAILED:"Προσωρινό πρόβλημα ανάγνωσης δεδομένων.",
    BACKEND_UNREACHABLE:"Δεν υπάρχει σύνδεση με το σύστημα. Δοκίμασε ξανά σε λίγο.",
    BACKEND_BAD_RESPONSE:"Το σύστημα επέστρεψε μη έγκυρη απάντηση.",
    TIMEOUT:"Η σύνδεση άργησε πολύ. Δοκίμασε ξανά."
  };
  return m[code]||"Κάτι πήγε στραβά. Δοκίμασε ξανά.";
}
function setMode(next){
  mode=next; const reg=mode==="register";
  loginTab.classList.toggle("active",!reg); registerTab.classList.toggle("active",reg);
  emailField.classList.toggle("hidden",!reg);
  authTitle.textContent=reg?"Δωρεάν εγγραφή":"Σύνδεση";
  authText.textContent=reg?"Δημιούργησε λογαριασμό. Θα επιβεβαιώσεις το email σου με 6ψήφιο κωδικό.":"Μπες στον λογαριασμό σου για να δεις τα ενεργά alerts.";
  authSubmit.textContent=reg?"Δημιουργία λογαριασμού":"Σύνδεση";
  haveCodeBtn.classList.toggle("hidden",!reg);
  password.autocomplete=reg?"new-password":"current-password";
  setMsg(authMsg,"");
}
loginTab.onclick=()=>setMode("login"); registerTab.onclick=()=>setMode("register");
haveCodeBtn.onclick=()=>{
  const u=username.value.trim();
  if(!u){setMsg(authMsg,"Γράψε πρώτα το όνομα χρήστη που έβαλες στην εγγραφή.","error");return;}
  pendingUsername=u;
  showVerify(u,"");
};

authSubmit.onclick=async()=>{
  setMsg(authMsg,"");
  const u=username.value.trim(), p=password.value, e=email.value.trim();
  if(!u||!p||(mode==="register"&&!e)){setMsg(authMsg,"Συμπλήρωσε όλα τα πεδία.","error");return;}
  const isRegister=mode==="register";
  const idleText=isRegister?"Δημιουργία λογαριασμού":"Σύνδεση";
  authSubmit.disabled=true;
  authSubmit.textContent=isRegister?"Δημιουργία…":"Σύνδεση…";
  setMsg(authMsg,isRegister?"Δημιουργούμε τον λογαριασμό σου…":"Γίνεται σύνδεση…");
  try{
    const r=await apiPost(isRegister?{action:"register",username:u,email:e,password:p}:{action:"login",username:u,password:p});
    if(!r.ok){
      if(r.error==="EMAIL_NOT_VERIFIED"){pendingUsername=u;showVerify(u,"");return;}
      throw new Error(r.error||"ERROR");
    }
    if(isRegister){
      pendingUsername=r.username||u;
      setVerifyExpiry(pendingUsername,15*60*1000);
      showVerify(pendingUsername,r.emailMasked||e);
      setMsg(verifyMsg,"Ο λογαριασμός δημιουργήθηκε. Στάλθηκε 6ψήφιος κωδικός στο email σου.","ok");
    }else{
      saveSession(r);
    }
  }catch(err){
    setMsg(authMsg,mapError(err.message),"error");
  }finally{
    authSubmit.disabled=false;
    authSubmit.textContent=idleText;
  }
};
let verifyTimerHandle=null;
function verifyExpiryKey(u){return "ma_verify_exp_"+String(u||"").toLowerCase();}
function setVerifyExpiry(u,ms){localStorage.setItem(verifyExpiryKey(u),String(Date.now()+ms));}
function clearVerifyExpiry(u){localStorage.removeItem(verifyExpiryKey(u));}
function updateVerifyTimer(){
  if(verifyTimerHandle){clearInterval(verifyTimerHandle);verifyTimerHandle=null;}
  const tick=()=>{
    const expiry=Number(localStorage.getItem(verifyExpiryKey(pendingUsername))||0);
    const left=Math.max(0,expiry-Date.now());
    if(left>0){
      const t=Math.ceil(left/1000), mm=String(Math.floor(t/60)).padStart(2,"0"), ss=String(t%60).padStart(2,"0");
      resendCode.disabled=true;
      resendCode.textContent="Ξαναστείλε σε "+mm+":"+ss;
      resendTimer.textContent="Ο κωδικός ισχύει για 15 λεπτά.";
    }else{
      resendCode.disabled=false;
      resendCode.textContent="Ξαναστείλε κωδικό";
      resendTimer.textContent="Ο κωδικός έληξε. Μπορείς να ζητήσεις νέο.";
      if(verifyTimerHandle){clearInterval(verifyTimerHandle);verifyTimerHandle=null;}
    }
  };
  tick();
  if(resendCode.disabled) verifyTimerHandle=setInterval(tick,1000);
}
function showVerify(u,masked){
  pendingUsername=u; authMain.classList.add("hidden"); verifyView.classList.remove("hidden");
  verifyText.textContent=masked?"Στείλαμε 6ψήφιο κωδικό στο "+masked+".":"Βάλε τον 6ψήφιο κωδικό που έλαβες στο email.";
  verifyCode.value=""; setMsg(verifyMsg,""); updateVerifyTimer();
}
verifySubmit.onclick=async()=>{
  const code=verifyCode.value.trim(); setMsg(verifyMsg,"");
  try{
    const r=await apiPost({action:"verify",username:pendingUsername,code});
    if(!r.ok) throw new Error(r.error||"ERROR");
    clearVerifyExpiry(pendingUsername);
    setMsg(verifyMsg,"Το email επιβεβαιώθηκε. Μπορείς τώρα να συνδεθείς.","ok");
    setTimeout(()=>{verifyView.classList.add("hidden");authMain.classList.remove("hidden");setMode("login");username.value=pendingUsername;password.value="";},900);
  }catch(err){
    if(err.message==="CODE_EXPIRED"){clearVerifyExpiry(pendingUsername);updateVerifyTimer();}
    setMsg(verifyMsg,mapError(err.message),"error");
  }
};
resendCode.onclick=async()=>{
  const u=(pendingUsername||username.value.trim());
  if(!u){setMsg(verifyMsg,"Δεν βρέθηκε όνομα χρήστη.","error");return;}
  resendCode.disabled=true;
  resendCode.textContent="Αποστολή…";
  setMsg(verifyMsg,"Στέλνω νέο κωδικό…");
  try{
    const r=await apiPost({action:"resend",username:u});
    if(!r.ok) throw new Error(r.error||"ERROR");
    setVerifyExpiry(u,15*60*1000);
    updateVerifyTimer();
    setMsg(verifyMsg,"Στάλθηκε νέος 6ψήφιος κωδικός. Έλεγξε το email σου (και τα Ανεπιθύμητα).","ok");
  }catch(err){
    resendCode.disabled=false;
    resendCode.textContent="Ξαναστείλε κωδικό";
    setMsg(verifyMsg,mapError(err.message),"error");
  }
};
backLogin.onclick=()=>{verifyView.classList.add("hidden");authMain.classList.remove("hidden");setMode("login");};

function saveSession(r){
  sessionToken=r.token; localStorage.setItem("ma_token",sessionToken); localStorage.setItem("ma_user",r.username||"");
  authView.classList.add("hidden");alertsView.classList.remove("hidden");currentUser.textContent=r.username||"";loadAlerts();
}
logoutBtn.onclick=async()=>{
  try{if(sessionToken)await apiPost({action:"logout",token:sessionToken});}catch(_){}
  localStorage.removeItem("ma_token");localStorage.removeItem("ma_user");sessionToken="";
  alertsView.classList.add("hidden");authView.classList.remove("hidden");authMain.classList.remove("hidden");verifyView.classList.add("hidden");setMode("login");
};
function badgeClass(a){return /WATCH/i.test(a)?"watch":(/ΔΥΝΑΤΟ|🔥/i.test(a)?"strong":"");}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function renderAlerts(alerts){
  if(!alerts.length){content.innerHTML='<div class="empty">Δεν υπάρχουν ενεργά alerts αυτή τη στιγμή.</div>';return;}
  const groups={}; alerts.forEach(a=>{(groups[a.league]||(groups[a.league]=[])).push(a);});
  content.innerHTML=Object.entries(groups).map(([league,rows])=>`<section class="league"><div class="league-head"><div class="league-title">${esc(league)}</div><div class="league-count">${rows.length} alerts</div></div>${rows.map(a=>`<div class="row"><div class="match">${esc(a.home)} – ${esc(a.away)}</div><div class="meta"><div class="side">${a.favoriteSide==="H"?"Favorite: Home":a.favoriteSide==="A"?"Favorite: Away":""}</div><div class="alert-right"><div class="badge ${badgeClass(a.alert)}">${esc(a.alert)}</div>${(a.leagueRecord||a.allStatsRecord)?`<div class="history">${a.rating?`<b>ΕΚΤΙΜΗΣΗ</b> ${esc(a.rating)} · `:""}<b>ΠΡΩΤΑΘΛΗΜΑ</b> ${esc(a.leagueRecord||"—")} · <b>ALL STATS</b> ${esc(a.allStatsRecord||"—")}</div>`:""}</div></div></div>`).join("")}</section>`).join("");
}
async function loadAlerts(){
  content.innerHTML='<div class="loading">Φόρτωση…</div>';
  try{
    const r=await apiPost({action:"alerts",token:sessionToken});
    if(!r.ok) throw new Error(r.error||"ERROR");
    currentUser.textContent=r.username||localStorage.getItem("ma_user")||"";
    counter.textContent=(r.count||0)+" ενεργά alerts";
    const d=new Date(r.updatedAt);updatedAt.textContent=isNaN(d)?"":("Updated "+d.toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"}));
    renderAlerts(r.alerts||[]);
  }catch(err){
    if(["INVALID_SESSION","SESSION_EXPIRED","LOGIN_REQUIRED","ACCESS_DENIED"].includes(err.message)){
      localStorage.removeItem("ma_token");localStorage.removeItem("ma_user");sessionToken="";
      alertsView.classList.add("hidden");authView.classList.remove("hidden");setMsg(authMsg,mapError(err.message),"error");
      return;
    }
    if(["SHEET_READ_FAILED","BACKEND_UNREACHABLE","BACKEND_BAD_RESPONSE","TIMEOUT"].includes(err.message)){
      try{
        const demo=await fetch("./demo-alerts.json?v=20260928-1840",{cache:"no-store"}).then(r=>r.json());
        counter.textContent=(demo.count||0)+" ενεργά alerts";
        updatedAt.textContent="Demo snapshot";
        renderAlerts(demo.alerts||[]);
        const note=document.createElement("div");
        note.className="empty";
        note.style.paddingTop="10px";
        note.textContent="Προσωρινό snapshot από το ALERT LOG · όχι ακόμα live σύνδεση";
        content.appendChild(note);
        return;
      }catch(_){}
    }
    content.innerHTML='<div class="empty">'+esc(mapError(err.message))+'</div>';
  }
}
if(sessionToken){authView.classList.add("hidden");alertsView.classList.remove("hidden");currentUser.textContent=localStorage.getItem("ma_user")||"";loadAlerts();}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script>
</body></html>
