<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="description" content="Match Alerts V1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Match Alerts</title>
<style>
:root{--bg:#070708;--text:#f7f6f1;--muted:#9c99a1;--gold:#d9b157;--gold2:#f1d78e;--line:rgba(255,255,255,.075)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(760px 430px at 50% -120px,rgba(217,177,87,.12),transparent 60%),linear-gradient(180deg,#0a0a0c 0%,#050506 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),transparent 86%)}
.app{width:min(100%,580px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px max(42px,env(safe-area-inset-bottom));position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--gold2);font-size:22px;border:1px solid rgba(217,177,87,.34);background:linear-gradient(145deg,rgba(217,177,87,.14),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.28)}
.brand h1{margin:0;font-family:Georgia,serif;font-size:24px;font-weight:600;line-height:1}.sub{margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:1.7px;text-transform:uppercase}
.live{display:flex;align-items:center;gap:7px;color:#b0aeb4;font-size:10px;letter-spacing:1.1px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(217,177,87,.75)}
.summary{border:1px solid rgba(217,177,87,.18);border-radius:26px;padding:17px 18px;margin-bottom:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 18px 48px rgba(0,0,0,.34)}
.summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.summary h2{margin:0;font-family:Georgia,serif;font-size:28px;line-height:1.05;font-weight:500}
.summary p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.counter{display:inline-flex;margin-top:14px;padding:8px 11px;border-radius:999px;background:rgba(217,177,87,.08);border:1px solid rgba(217,177,87,.18);color:#fff4d2;font-size:11px;font-weight:800;white-space:nowrap}
.status-mini{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:4px}
.league{margin:18px 0 10px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.018));box-shadow:0 12px 32px rgba(0,0,0,.22)}
.league-head{padding:14px 14px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055)}.league-title{font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--gold2)}.league-count{font-size:11px;color:var(--muted)}
.row{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.045)}.row:last-child{border-bottom:0}.match{font-size:15px;font-weight:800;letter-spacing:-.15px;line-height:1.25;margin-bottom:7px}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.left-meta{min-width:0;flex:1}.time{color:#8e8b93;font-size:12px}.right-meta{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid rgba(217,177,87,.18);background:rgba(217,177,87,.075);color:#fff7de;white-space:nowrap}.badge.watch{color:#ededf0;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:10px;line-height:1}.stat-label{color:#cbc7bb;font-weight:800}.stat-value{color:#fff;font-weight:900}
footer{text-align:center;color:#68656d;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;padding-top:28px}
@media(max-width:470px){.summary-top{flex-direction:column}.status-mini{padding-top:0}.meta{flex-direction:column;gap:10px}.right-meta{align-items:flex-start}.stats{justify-content:flex-start}.badge{white-space:normal}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand"><div class="logo">♛</div><div><h1>Match Alerts</h1><div class="sub">Private Access</div></div></div><div class="live"><span class="dot"></span>Live</div></div>
<section class="summary"><div class="summary-top"><div><h2>Today's Alerts</h2><p>Καθαρή προβολή των ενεργών alerts, χωρισμένα ανά πρωτάθλημα.</p></div><div class="status-mini">Updated 12:47</div></div><div class="counter">18 ενεργά alerts</div></section>
<div id="content"></div><footer>Version 1 · Preview build</footer></main>
<script>
const groups=[["Premier League",[["14:30","Arsenal – Everton","🔔🔥 ΔΥΝΑΤΟ ΦΑΒΟΡΙ","PL 91% (10/11)","ALL 87% (34/39)"],["17:00","Liverpool – Brighton","🔔 ΦΑΒΟΡΙ","PL 74% (17/23)","ALL 77% (61/79)"],["17:00","Chelsea – Wolves","👁️ WATCH ΦΑΒΟΡΙ","PL 58% (11/19)","ALL 55% (21/38)"],["19:30","Tottenham – Aston Villa","🔔🔥 ΔΥΝΑΤΟ ΚΟΝΤΡΑ","PL 86% (12/14)","ALL 88% (28/32)"]]],["La Liga",[["15:00","Villarreal – Getafe","🔔 ΦΑΒΟΡΙ","La Liga 78% (14/18)","ALL 77% (61/79)"],["17:15","Sevilla – Mallorca","👁️ WATCH ΚΟΝΤΡΑ","La Liga 31% (4/13)","ALL 30% (3/10)"],["19:30","Barcelona – Valencia","🔔🔥 ΔΥΝΑΤΟ ΦΑΒΟΡΙ","La Liga 100% (7/7)","ALL 87% (34/39)"]]],["Serie A",[["13:30","Bologna – Lecce","🔔💎 ΦΑΒΟΡΙ ΤΖΙΡΟΥ","Serie A 83% (10/12)","ALL 75% (15/20)"],["16:00","Roma – Torino","🔔🔥 ΔΥΝΑΤΟ ΚΟΝΤΡΑ","Serie A 80% (8/10)","ALL 88% (28/32)"],["19:00","Napoli – Udinese","🔔 ΦΑΒ 75+","Serie A 84% (16/19)","ALL 80% (16/20)"],["21:45","Inter – Parma","🔔🔥 ΔΥΝΑΤΟ ΦΑΒΟΡΙ","Serie A 100% (4/4)","ALL 87% (34/39)"]]],["Bundesliga",[["16:30","Leverkusen – Augsburg","🔔 ΦΑΒΟΡΙ","Bundesliga 73% (8/11)","ALL 77% (61/79)"],["16:30","Dortmund – Mainz","👁️ WATCH ΦΑΒΟΡΙ","Bundesliga 50% (3/6)","ALL 55% (21/38)"],["19:30","Bayern – Freiburg","🔔🔥 ΔΥΝΑΤΟ ΦΑΒΟΡΙ","Bundesliga 100% (5/5)","ALL 87% (34/39)"]]],["Ligue 1",[["18:00","Monaco – Lens","🔔🔥 ΔΥΝΑΤΟ ΚΟΝΤΡΑ","Ligue 1 90% (9/10)","ALL 88% (28/32)"],["20:00","Lille – Nantes","🔔 ΦΑΒΟΡΙ","Ligue 1 80% (8/10)","ALL 77% (61/79)"]]],["Super League",[["18:30","PAOK – Aris","🔔💎 ΦΑΒΟΡΙ SOFA+ΤΖΙΡΟΥ","Super League 100% (3/3)","ALL 81% (13/16)"],["21:00","Panathinaikos – OFI","👁️ WATCH ΦΑΒΟΡΙ","Super League 67% (2/3)","ALL 55% (21/38)"]]]];
const root=document.getElementById("content");
root.innerHTML=groups.map(([league,matches])=>`<section class="league"><div class="league-head"><div class="league-title">${league}</div><div class="league-count">${matches.length} alerts</div></div>${matches.map(([time,match,alert,leagueStat,allStat])=>`<div class="row"><div class="match">${match}</div><div class="meta"><div class="left-meta"><div class="time">${time}</div></div><div class="right-meta"><div class="badge ${alert.includes("WATCH")?"watch":""}">${alert}</div><div class="stats"><div class="stat"><span class="stat-label">League</span><span class="stat-value">${leagueStat}</span></div><div class="stat"><span class="stat-label">Overall</span><span class="stat-value">${allStat}</span></div></div></div></div></div>`).join("")}</section>`).join("");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script></body></html>
