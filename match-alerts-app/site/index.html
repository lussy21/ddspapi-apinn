<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="DreamTeamTips · Private Members Club">
<title>DreamTeamTips · Private Members Club</title>
<link rel="icon" href="dreamteamtips-icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
.hero{position:relative;width:min(100vw,520px);background:#000}
.hero img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.hero-club-label{position:absolute;left:13%;right:13%;top:32.15%;height:3.65%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(2,3,4,.98) 0%,rgba(2,3,4,.96) 56%,rgba(2,3,4,.72) 76%,rgba(2,3,4,0) 100%);color:#e9d9b9;font-size:clamp(8px,2.45vw,13px);font-weight:500;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;text-shadow:0 0 12px rgba(222,176,73,.24);pointer-events:none}.hero-club-label:before,.hero-club-label:after{content:"";height:1px;flex:1;max-width:58px;background:linear-gradient(90deg,transparent,#c28d2e)}.hero-club-label:after{background:linear-gradient(90deg,#c28d2e,transparent)}.hero-club-label span{padding:0 10px;white-space:nowrap}
.login-hotspot{position:absolute;left:18.2%;top:40.55%;width:62.1%;height:6.05%;border:0;background:transparent;cursor:pointer;border-radius:18px;-webkit-tap-highlight-color:transparent}
.login-hotspot:active{background:rgba(255,255,255,.06)}
.login-layer{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:0 18px 24px;background:rgba(0,0,0,.12)}
.login-layer.open{display:flex}
.login-card{position:relative;width:min(420px,88vw);margin-top:46vh;padding:18px 20px 19px;border:1px solid rgba(224,176,69,.46);border-radius:22px;background:linear-gradient(180deg,rgba(7,7,8,.90),rgba(4,4,5,.94));box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 28px rgba(217,169,64,.06);backdrop-filter:blur(6px)}
.close{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);color:#b8b0a4;font-size:18px}
.login-brand{display:none}.login-title{text-align:center;margin:3px 0 14px;font:500 22px Georgia,serif;color:#f1eadb}
.field{margin-top:10px}.field label{display:block;margin:0 0 6px 2px;color:#c6beb3;font-size:9px;font-weight:900}
.field input{width:100%;height:46px;border:1px solid rgba(225,180,73,.27);border-radius:13px;background:rgba(5,5,6,.82);color:#fff;padding:0 13px;font:inherit;outline:none}
.field input:focus{border-color:rgba(217,169,64,.52)}
.submit{width:100%;height:48px;margin-top:14px;border:1px solid #edbd52;border-radius:13px;background:linear-gradient(135deg,#b97818,#efbd4f,#ffe298);color:#080808;font-weight:1000;letter-spacing:.5px}
.submit:disabled{opacity:.62}.msg{min-height:18px;margin-top:10px;text-align:center;color:#ffb3bc;font-size:10px;line-height:1.4}
.signup-line{text-align:center;margin-top:11px;color:#aaa39b;font-size:10px}.signup-line button{border:0;background:transparent;color:#e7bd5b;font:inherit;font-weight:800;padding:0 0 0 4px;cursor:pointer}.private-note{text-align:center;margin-top:8px;color:#6f696d;font-size:8px;letter-spacing:.4px}
@media(min-width:700px){.hero{box-shadow:0 0 80px rgba(0,0,0,.9)}}
</style>
</head>
<body>
<main class="hero">
  <img src="approved-hero.webp" alt="DreamTeamTips Private Members Club"><div class="hero-club-label"><span>PRIVATE MEMBERS CLUB</span></div>
  <button id="openLogin" class="login-hotspot" aria-label="Είσοδος Μελών"></button>
</main>

<div id="loginLayer" class="login-layer" aria-hidden="true">
  <section class="login-card">
    <button id="closeLogin" class="close" aria-label="Κλείσιμο">×</button>
    <div class="login-title">Είσοδος μελών</div>
    <div class="field"><label for="loginUser">Όνομα χρήστη</label><input id="loginUser" autocomplete="username" placeholder="username"></div>
    <div class="field"><label for="loginPass">Κωδικός</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginSubmit" class="submit">ΕΙΣΟΔΟΣ</button>
    <div id="loginMsg" class="msg"></div>
    <div class="signup-line">Δεν έχεις λογαριασμό;<button id="signupLink" type="button">Δημιουργία λογαριασμού</button></div>
    <div class="private-note">Πρόσβαση μόνο για εγκεκριμένα μέλη</div>
  </section>
</div>

<script>
const layer=document.getElementById("loginLayer"),openBtn=document.getElementById("openLogin"),closeBtn=document.getElementById("closeLogin");
const user=document.getElementById("loginUser"),pass=document.getElementById("loginPass"),submit=document.getElementById("loginSubmit"),msg=document.getElementById("loginMsg"),signupLink=document.getElementById("signupLink");
const DEVICE_STORAGE_KEY="dtt_device_id_v1";const APP_URL="https://match-alerts-private.onrender.com/";const API_URL="https://match-alerts-api-private.onrender.com/api";
function deviceId(){let x=localStorage.getItem(DEVICE_STORAGE_KEY)||"";if(x)return x;try{x=crypto.randomUUID()}catch(_){x="dtt-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}localStorage.setItem(DEVICE_STORAGE_KEY,x);return x}
function openLogin(){if(localStorage.getItem("ma_token")){location.href=APP_URL;return}layer.classList.add("open");layer.setAttribute("aria-hidden","false");setTimeout(()=>user.focus(),80)}
function closeLogin(){layer.classList.remove("open");layer.setAttribute("aria-hidden","true");msg.textContent=""}
openBtn.onclick=openLogin;closeBtn.onclick=closeLogin;layer.onclick=e=>{if(e.target===layer)closeLogin()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLogin()});signupLink.onclick=()=>{msg.textContent="Η δημιουργία λογαριασμού θα ενεργοποιηθεί στο επόμενο βήμα.";};
async function apiPost(params){const c=new AbortController(),t=setTimeout(()=>c.abort(),16000);try{const b=new URLSearchParams();Object.entries(params).forEach(([k,v])=>b.append(k,String(v??"")));const r=await fetch(API_URL,{method:"POST",body:b,signal:c.signal,cache:"no-store"});return await r.json()}finally{clearTimeout(t)}}
const errors={INVALID_LOGIN:"Λάθος όνομα χρήστη ή κωδικός.",DEVICE_LOCKED:"Ο λογαριασμός είναι συνδεδεμένος με άλλη συσκευή.",EMAIL_NOT_VERIFIED:"Το email δεν έχει επιβεβαιωθεί.",ACCESS_REVOKED:"Η πρόσβασή σου έχει απενεργοποιηθεί.",SUBSCRIPTION_EXPIRED:"Η συνδρομή σου έχει λήξει."};
async function doLogin(){const u=user.value.trim(),p=pass.value;if(!u||!p){msg.textContent="Συμπλήρωσε όνομα χρήστη και κωδικό.";return}submit.disabled=true;submit.textContent="ΣΥΝΔΕΣΗ…";msg.textContent="";try{const r=await apiPost({action:"login",username:u,password:p,deviceId:deviceId()});if(!r.ok)throw new Error(r.error||"ERROR");if(r.token)localStorage.setItem("ma_token",r.token);location.href=APP_URL}catch(e){msg.textContent=errors[e.message]||"Δεν ολοκληρώθηκε η σύνδεση. Δοκίμασε ξανά."}finally{submit.disabled=false;submit.textContent="ΕΙΣΟΔΟΣ"}}
submit.onclick=doLogin;pass.onkeydown=e=>{if(e.key==="Enter")doLogin()};
</script>
</body>
</html>
