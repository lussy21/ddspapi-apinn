<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="DreamTeamTips · Private Members Area">
<title>DreamTeamTips · Private Members Area</title>
<link rel="icon" href="../dreamteamtips-icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
.hero{position:relative;width:min(100vw,520px);background:#000}
.hero img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.login-hotspot{position:absolute;left:18.2%;top:40.55%;width:62.1%;height:6.05%;border:0;background:transparent;cursor:pointer;border-radius:18px;-webkit-tap-highlight-color:transparent}
.login-hotspot:active{background:rgba(255,255,255,.06)}
.login-layer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px)}
.login-layer.open{display:flex}
.login-card{position:relative;width:min(420px,100%);padding:28px 24px 24px;border:1px solid rgba(224,176,69,.38);border-radius:25px;background:radial-gradient(280px 160px at 50% 0,rgba(217,169,64,.12),transparent 72%),linear-gradient(180deg,#101011,#080809);box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 40px rgba(217,169,64,.06)}
.close{position:absolute;right:13px;top:13px;width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);color:#aaa;font-size:19px}
.login-brand{text-align:center}
.login-brand img{width:62px;height:62px;border-radius:18px;border:1px solid rgba(217,177,87,.42)}
.login-brand h2{margin:12px 0 4px;font:600 29px Georgia,serif;color:#f4d071}
.login-brand h2 span{color:#f3f0eb}
.login-brand p{margin:0;color:#8c8274;font-size:8px;letter-spacing:2px;text-transform:uppercase}
.login-title{text-align:center;margin:24px 0 17px;font:500 24px Georgia,serif;color:#f1eadb}
.field{margin-top:11px}.field label{display:block;margin:0 0 6px 2px;color:#b9b1b3;font-size:9px;font-weight:900}
.field input{width:100%;height:48px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:#070708;color:#fff;padding:0 13px;font:inherit;outline:none}
.field input:focus{border-color:rgba(217,169,64,.52)}
.submit{width:100%;height:50px;margin-top:17px;border:1px solid #edbd52;border-radius:13px;background:linear-gradient(135deg,#b97818,#efbd4f,#ffe298);color:#080808;font-weight:1000;letter-spacing:.5px}
.submit:disabled{opacity:.62}.msg{min-height:18px;margin-top:10px;text-align:center;color:#ffb3bc;font-size:10px;line-height:1.4}
.private-note{text-align:center;margin-top:8px;color:#6f696d;font-size:8px;letter-spacing:.4px}
@media(min-width:700px){.hero{box-shadow:0 0 80px rgba(0,0,0,.9)}}
</style>
</head>
<body>
<main class="hero">
  <img src="approved-hero.webp" alt="DreamTeamTips Private Members Area">
  <button id="openLogin" class="login-hotspot" aria-label="Είσοδος Μελών"></button>
</main>

<div id="loginLayer" class="login-layer" aria-hidden="true">
  <section class="login-card">
    <button id="closeLogin" class="close" aria-label="Κλείσιμο">×</button>
    <div class="login-brand">
      <img src="../dreamteamtips-icon.svg" alt="">
      <h2>DreamTeam<span>Tips</span></h2>
      <p>Private Members Area</p>
    </div>
    <div class="login-title">Είσοδος μελών</div>
    <div class="field"><label for="loginUser">Όνομα χρήστη</label><input id="loginUser" autocomplete="username" placeholder="username"></div>
    <div class="field"><label for="loginPass">Κωδικός</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginSubmit" class="submit">ΕΙΣΟΔΟΣ</button>
    <div id="loginMsg" class="msg"></div>
    <div class="private-note">Πρόσβαση μόνο για εγκεκριμένα μέλη</div>
  </section>
</div>

<script>
const layer=document.getElementById("loginLayer"),openBtn=document.getElementById("openLogin"),closeBtn=document.getElementById("closeLogin");
const user=document.getElementById("loginUser"),pass=document.getElementById("loginPass"),submit=document.getElementById("loginSubmit"),msg=document.getElementById("loginMsg");
const DEVICE_STORAGE_KEY="dtt_device_id_v1";
function deviceId(){let x=localStorage.getItem(DEVICE_STORAGE_KEY)||"";if(x)return x;try{x=crypto.randomUUID()}catch(_){x="dtt-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}localStorage.setItem(DEVICE_STORAGE_KEY,x);return x}
function openLogin(){if(localStorage.getItem("ma_token")){location.href="../";return}layer.classList.add("open");layer.setAttribute("aria-hidden","false");setTimeout(()=>user.focus(),80)}
function closeLogin(){layer.classList.remove("open");layer.setAttribute("aria-hidden","true");msg.textContent=""}
openBtn.onclick=openLogin;closeBtn.onclick=closeLogin;layer.onclick=e=>{if(e.target===layer)closeLogin()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLogin()});
async function apiPost(params){const c=new AbortController(),t=setTimeout(()=>c.abort(),16000);try{const b=new URLSearchParams();Object.entries(params).forEach(([k,v])=>b.append(k,String(v??"")));const r=await fetch("/api",{method:"POST",body:b,signal:c.signal,cache:"no-store"});return await r.json()}finally{clearTimeout(t)}}
const errors={INVALID_LOGIN:"Λάθος όνομα χρήστη ή κωδικός.",DEVICE_LOCKED:"Ο λογαριασμός είναι συνδεδεμένος με άλλη συσκευή.",EMAIL_NOT_VERIFIED:"Το email δεν έχει επιβεβαιωθεί.",ACCESS_REVOKED:"Η πρόσβασή σου έχει απενεργοποιηθεί.",SUBSCRIPTION_EXPIRED:"Η συνδρομή σου έχει λήξει."};
async function doLogin(){const u=user.value.trim(),p=pass.value;if(!u||!p){msg.textContent="Συμπλήρωσε όνομα χρήστη και κωδικό.";return}submit.disabled=true;submit.textContent="ΣΥΝΔΕΣΗ…";msg.textContent="";try{const r=await apiPost({action:"login",username:u,password:p,deviceId:deviceId()});if(!r.ok)throw new Error(r.error||"ERROR");if(r.token)localStorage.setItem("ma_token",r.token);location.href="../"}catch(e){msg.textContent=errors[e.message]||"Δεν ολοκληρώθηκε η σύνδεση. Δοκίμασε ξανά."}finally{submit.disabled=false;submit.textContent="ΕΙΣΟΔΟΣ"}}
submit.onclick=doLogin;pass.onkeydown=e=>{if(e.key==="Enter")doLogin()};
</script>
</body>
</html>
