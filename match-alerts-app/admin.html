<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Match Alerts Admin</title>
<style>
:root{--bg:#070708;--text:#f7f6f1;--muted:#9c99a1;--gold:#d9b157;--gold2:#f1d78e;--line:rgba(255,255,255,.075)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(760px 430px at 50% -120px,rgba(217,177,87,.12),transparent 60%),linear-gradient(180deg,#0a0a0c 0%,#050506 100%);padding:18px}
.wrap{width:min(100%,560px);margin:24px auto}
.panel{background:linear-gradient(150deg,#111114,#080809);border:1px solid rgba(217,177,87,.22);border-radius:26px;box-shadow:0 25px 80px rgba(0,0,0,.6);overflow:hidden}
.head{padding:18px;border-bottom:1px solid var(--line)}.sub{color:var(--muted);font-size:10px;letter-spacing:1.7px;text-transform:uppercase}.title{font-family:Georgia,serif;font-size:26px;margin-top:5px}
.body{padding:18px}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:14px}
.input,.number{width:100%;background:#0a0a0c;border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;padding:13px 14px;font:inherit;outline:none}.input:focus,.number:focus{border-color:rgba(217,177,87,.55)}
.btn{border:1px solid rgba(217,177,87,.28);background:linear-gradient(145deg,rgba(217,177,87,.18),rgba(217,177,87,.08));color:#fff4d2;border-radius:14px;padding:12px 14px;font-weight:900}.btn.secondary{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09);color:#e7e5e8}
.actions{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}.actions>*{flex:1}.msg{margin-top:12px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{padding:13px 10px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.section{margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}.section h3{margin:0 0 10px;font-size:13px;color:var(--gold2);letter-spacing:1px;text-transform:uppercase}
.user{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055)}.user:last-child{border-bottom:0}.name{font-weight:800;font-size:14px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.buttons{display:flex;gap:6px}.mini{padding:8px 9px;border-radius:10px;font-size:10px;font-weight:900;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff}.mini.danger{border-color:rgba(220,70,80,.24);color:#ffb8be}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap"><section class="panel">
<div class="head"><div class="sub">Owner only</div><div class="title">Admin Panel</div></div>
<div class="body">
<div id="lock">
<div class="note">Βάλε τον προσωπικό admin κωδικό σου.</div>
<input class="input" id="adminCode" type="password" placeholder="Admin code" autocomplete="off">
<div class="actions"><button class="btn" id="unlock">Άνοιγμα Admin</button></div>
<div class="msg" id="lockMsg"></div>
</div>
<div id="dash" class="hidden">
<div class="stats"><div class="stat"><b id="used">0</b><span>Εγγεγραμμένοι</span></div><div class="stat"><b id="max">2</b><span>Όριο</span></div><div class="stat"><b id="free">2</b><span>Θέσεις</span></div></div>
<div class="section"><h3>Όριο εγγραφών</h3><input class="number" id="maxInput" type="number" min="0" step="1" value="2"><div class="actions"><button class="btn" id="saveMax">Αποθήκευση ορίου</button><button class="btn secondary" id="refresh">Ανανέωση</button></div></div>
<div class="section"><h3>Εγγεγραμμένοι χρήστες</h3><div id="users"><div class="note">Δεν υπάρχουν χρήστες ακόμα.</div></div></div>
<div class="msg" id="msg"></div>
</div>
</div></section></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwRUaBGKeUQm-L2P2mar42FXVdHAB1mNGkxCscnMMDAk_BDZXq2ADZyXo7YZI7NH89Z/exec";
let adminSecret="";
function apiPost(params){
  if(!API_URL) return Promise.reject(new Error("BACKEND_NOT_CONNECTED"));
  return new Promise((resolve,reject)=>{
    const requestId="r"+Date.now()+Math.random().toString(36).slice(2);
    const frame=document.createElement("iframe");
    frame.name=requestId;
    frame.style.display="none";
    const form=document.createElement("form");
    form.method="POST";
    form.action=API_URL;
    form.target=requestId;
    form.style.display="none";
    const payload={...params,bridge:"1",requestId};
    Object.entries(payload).forEach(([k,v])=>{
      const input=document.createElement("input");
      input.type="hidden"; input.name=k; input.value=String(v??"");
      form.appendChild(input);
    });
    const timer=setTimeout(()=>{cleanup();reject(new Error("TIMEOUT"));},15000);
    function onMessage(ev){
      if(ev.origin!=="https://script.google.com" && !ev.origin.endsWith(".googleusercontent.com")) return;
      const data=ev.data||{};
      if(data.source!=="MATCH_ALERTS_API"||data.requestId!==requestId) return;
      cleanup(); resolve(data.payload);
    }
    function cleanup(){
      clearTimeout(timer); window.removeEventListener("message",onMessage);
      frame.remove(); form.remove();
    }
    window.addEventListener("message",onMessage);
    document.body.appendChild(frame); document.body.appendChild(form); form.submit();
  });
}
async function loadAdmin(){
  const settings=await apiPost({action:"adminSettings",adminCode:adminSecret});
  if(!settings.ok) throw new Error(settings.error||"ADMIN_ERROR");
  used.textContent=settings.usedUsers; max.textContent=settings.maxUsers; free.textContent=settings.freeSlots; maxInput.value=settings.maxUsers;
  const list=await apiPost({action:"adminUsers",adminCode:adminSecret});
  if(!list.ok) throw new Error(list.error||"ADMIN_ERROR");
  renderUsers(list.users||[]);
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function safe(v){return String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function renderUsers(arr){
  users.innerHTML=arr.length?arr.map(u=>`<div class="user"><div><div class="name">${esc(u.username)}</div><div class="meta">${u.verified?(u.revoked?"Κομμένη πρόσβαση":"Ενεργός"):"Email σε αναμονή"} · ${esc(u.email||"")} · ${esc((u.createdAt||"").slice(0,10))}</div></div><div class="buttons">${u.revoked?`<button class="mini" onclick="act('adminRestore','${safe(u.username)}')">Ενεργοποίηση</button>`:`<button class="mini" onclick="act('adminRevoke','${safe(u.username)}')">Κόψιμο</button>`}<button class="mini danger" onclick="act('adminDelete','${safe(u.username)}')">Διαγραφή</button></div></div>`).join(""):'<div class="note">Δεν υπάρχουν χρήστες ακόμα.</div>';
}
window.act=async(action,username)=>{
  try{const r=await apiPost({action,adminCode:adminSecret,username});if(!r.ok)throw new Error(r.error||"ADMIN_ERROR");await loadAdmin();msg.textContent=action==="adminDelete"?"Ο χρήστης διαγράφηκε και η θέση ελευθερώθηκε.":"Η πρόσβαση ενημερώθηκε.";}catch(e){msg.textContent="Σφάλμα: "+e.message;}
};
unlock.onclick=async()=>{adminSecret=adminCode.value.trim();if(!adminSecret){lockMsg.textContent="Βάλε admin code.";return;}if(!API_URL){lockMsg.textContent="Η σελίδα είναι έτοιμη. Απομένει η σύνδεση του Apps Script URL.";return;}try{await loadAdmin();lock.classList.add("hidden");dash.classList.remove("hidden");}catch(e){lockMsg.textContent=e.message==="ADMIN_UNAUTHORIZED"?"Λάθος admin code.":"Δεν έγινε σύνδεση με το backend.";}};
refresh.onclick=()=>loadAdmin().catch(e=>msg.textContent="Σφάλμα: "+e.message);
saveMax.onclick=async()=>{const n=Math.max(0,parseInt(maxInput.value||"0",10));try{const r=await apiPost({action:"adminSetMaxUsers",adminCode:adminSecret,maxUsers:n});if(!r.ok)throw new Error(r.error||"ADMIN_ERROR");await loadAdmin();msg.textContent="Το όριο άλλαξε σε "+n+".";}catch(e){msg.textContent="Σφάλμα: "+e.message;}};
</script>
</body></html>
